services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-omnistudio}
      MYSQL_USER: ${MYSQL_USER:-omnistudio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - omniStudioNextMysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  omnistudio-next:
    build: .
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3000/api/auth/setupStatus'); if (!response.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - omniStudioNextData:/app/data
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-omnistudio}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-omnistudio}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      MYSQL_CONNECT_TIMEOUT_MS: ${MYSQL_CONNECT_TIMEOUT_MS:-10000}
      OMNISTUDIO_NEXT_AGENT_CONCURRENCY: ${OMNISTUDIO_NEXT_AGENT_CONCURRENCY:-8}
      OMNISTUDIO_NEXT_MEDIA_CONCURRENCY: ${OMNISTUDIO_NEXT_MEDIA_CONCURRENCY:-20}
      OMNISTUDIO_NEXT_FFMPEG_CONCURRENCY: ${OMNISTUDIO_NEXT_FFMPEG_CONCURRENCY:-2}
      OMNISTUDIO_NEXT_UPLOAD_CONCURRENCY: ${OMNISTUDIO_NEXT_UPLOAD_CONCURRENCY:-8}
      UTOOO_SEEDANCE_API_KEY: ${UTOOO_SEEDANCE_API_KEY:-}
      OMNISTUDIO_NEXT_PUBLIC_URL: ${OMNISTUDIO_NEXT_PUBLIC_URL:-}

volumes:
  omniStudioNextData:
  omniStudioNextMysql:
