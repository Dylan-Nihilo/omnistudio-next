name: Fetch latest backup data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          serverHost: ${{ secrets.DEPLOY_HOST }}
          serverUser: ${{ secrets.DEPLOY_USER }}
          serverPath: ${{ secrets.DEPLOY_PATH }}
          deploySshKey: ${{ secrets.DEPLOY_SSH_KEY }}
          deployKnownHosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$deploySshKey" > "$RUNNER_TEMP/deployKey"
          printf '%s\n' "$deployKnownHosts" > "$RUNNER_TEMP/sshKnownHosts"

      - name: Extract from latest backup
        env:
          serverHost: ${{ secrets.DEPLOY_HOST }}
          serverUser: ${{ secrets.DEPLOY_USER }}
          serverPath: ${{ secrets.DEPLOY_PATH }}
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)

          ssh "${sshOptions[@]}" "$serverUser@$serverHost" bash -s -- "$serverPath" > backupData.txt << 'EOF'
          set -e
          serverPath="$1"
          latestBackup=$(ls -td "$serverPath"/backups/attempt* 2>/dev/null | head -n 1)
          if [[ -z "$latestBackup" ]]; then
            echo "NO_BACKUP_FOUND"
            exit 0
          fi
          echo "=== BACKUP_DIR ==="
          echo "$latestBackup"

          echo "=== ENV_FILE ==="
          if [[ -f "$latestBackup/environment" ]]; then
            cat "$latestBackup/environment"
          fi

          echo "=== KEY_BASE64 ==="
          if [[ -f "$latestBackup/appData.tar.gz" ]]; then
            tar -zxvf "$latestBackup/appData.tar.gz" ./platformSecret.key -O 2>/dev/null | base64 | tr -d '\r\n' || true
          fi
          echo ""

          echo "=== SQL_PLATFORM_CONFIGS ==="
          if [[ -f "$latestBackup/database.sql.gz" ]]; then
            zgrep -a 'INSERT INTO `platform_provider_configs`' "$latestBackup/database.sql.gz" || true
          fi

          echo "=== SQL_PLATFORM_SECRETS ==="
          if [[ -f "$latestBackup/database.sql.gz" ]]; then
            zgrep -a 'INSERT INTO `platform_secrets`' "$latestBackup/database.sql.gz" || true
          fi
          EOF

      - name: Inspect output
        run: |
          cat backupData.txt
          node -e '
            const fs = require("fs");
            const content = fs.readFileSync("backupData.txt", "utf8");
            fs.writeFileSync("backupExport.json", JSON.stringify({ raw: content }));
          '

      - uses: actions/upload-artifact@v7
        with:
          name: backupExport
          path: backupData.txt
          retention-days: 1

      - name: Clean runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deployKey" "$RUNNER_TEMP/sshKnownHosts"
