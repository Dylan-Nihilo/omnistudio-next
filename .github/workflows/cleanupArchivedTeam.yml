name: Cleanup Archived Team

on:
  workflow_dispatch:
    inputs:
      action:
        description: "操作模式 (inspect: 仅查询, delete: 执行删除)"
        type: choice
        options:
          - inspect
          - delete
        default: inspect

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          serverHost: ${{ secrets.DEPLOY_HOST }}
          serverUser: ${{ secrets.DEPLOY_USER }}
          serverPath: ${{ secrets.DEPLOY_PATH }}
          deploySshKey: ${{ secrets.DEPLOY_SSH_KEY }}
          deployKnownHosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$deploySshKey" > "$RUNNER_TEMP/deployKey"
          printf '%s\n' "$deployKnownHosts" > "$RUNNER_TEMP/sshKnownHosts"

      - name: Query or Delete Archived Team
        env:
          serverHost: ${{ secrets.DEPLOY_HOST }}
          serverUser: ${{ secrets.DEPLOY_USER }}
          serverPath: ${{ secrets.DEPLOY_PATH }}
          ACTION: ${{ inputs.action }}
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)

          ssh "${sshOptions[@]}" "$serverUser@$serverHost" bash -s -- "$serverPath" "$ACTION" << 'EOF'
          set -e
          serverPath="$1"
          action="$2"
          cd "$serverPath"

          mysqlContainer=$(docker compose -p omnistudio-next --env-file .env -f compose.yaml ps -q mysql)
          if [[ -z "$mysqlContainer" ]]; then
            echo "ERROR: mysql container not found"
            exit 1
          fi

          echo "=========================================="
          echo "1. 目标已解散的工作区 (id = 966a70f2-00b3-42d2-b301-8a0109d4df14)"
          echo "=========================================="
          docker exec "$mysqlContainer" sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --default-character-set=utf8mb4 --user="$MYSQL_USER" --database="$MYSQL_DATABASE" -e "
            SELECT id, name, owner_user_id, status FROM user_teams WHERE id = \"966a70f2-00b3-42d2-b301-8a0109d4df14\";
          "'

          echo "=========================================="
          echo "2. 正在执行彻底删除该已解散工作区及其关联成员数据..."
          echo "=========================================="
          docker exec "$mysqlContainer" sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --default-character-set=utf8mb4 --user="$MYSQL_USER" --database="$MYSQL_DATABASE" -e "
            DELETE FROM user_team_members WHERE team_id = \"966a70f2-00b3-42d2-b301-8a0109d4df14\";
            DELETE FROM user_team_invitations WHERE team_id = \"966a70f2-00b3-42d2-b301-8a0109d4df14\";
            DELETE FROM user_team_assets WHERE team_id = \"966a70f2-00b3-42d2-b301-8a0109d4df14\";
            DELETE FROM user_credit_transfers WHERE team_id = \"966a70f2-00b3-42d2-b301-8a0109d4df14\";
            DELETE FROM user_teams WHERE id = \"966a70f2-00b3-42d2-b301-8a0109d4df14\" AND status = \"archived\";
          "'

          echo "=========================================="
          echo "3. 删除后剩余的全部团队列表 (user_teams)"
          echo "=========================================="
          docker exec "$mysqlContainer" sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --default-character-set=utf8mb4 --user="$MYSQL_USER" --database="$MYSQL_DATABASE" -e "
            SELECT id, name, owner_user_id, status, created_at FROM user_teams;
          "'
          EOF

      - name: Clean runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deployKey" "$RUNNER_TEMP/sshKnownHosts"
