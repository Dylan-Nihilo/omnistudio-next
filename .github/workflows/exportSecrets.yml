name: Export online secrets for local sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          serverHost: ${{ secrets.DEPLOY_HOST }}
          serverUser: ${{ secrets.DEPLOY_USER }}
          serverPath: ${{ secrets.DEPLOY_PATH }}
          deploySshKey: ${{ secrets.DEPLOY_SSH_KEY }}
          deployKnownHosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$deploySshKey" > "$RUNNER_TEMP/deployKey"
          printf '%s\n' "$deployKnownHosts" > "$RUNNER_TEMP/sshKnownHosts"

      - name: Fetch remote secrets
        env:
          serverHost: ${{ secrets.DEPLOY_HOST }}
          serverUser: ${{ secrets.DEPLOY_USER }}
          serverPath: ${{ secrets.DEPLOY_PATH }}
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)

          ssh "${sshOptions[@]}" "$serverUser@$serverHost" bash -s -- "$serverPath" > onlineRaw.txt << 'EOF'
          targetPath="$1"
          cd "$targetPath" || exit 1

          echo "=== ENV_START ==="
          cat .env
          echo "=== ENV_END ==="

          compose=(docker compose -p omnistudio-next --env-file .env -f compose.yaml)
          if [[ -f releaseCompose.yaml ]]; then compose+=(-f releaseCompose.yaml); fi

          appContainer=$("${compose[@]}" ps -q omnistudio-next 2>/dev/null || true)
          if [[ -n "$appContainer" ]]; then
            dataPath=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Source}}{{end}}{{end}}' "$appContainer" 2>/dev/null || true)
            echo "=== KEY_START ==="
            if [[ -n "$dataPath" && -f "$dataPath/platformSecret.key" ]]; then
              base64 "$dataPath/platformSecret.key" | tr -d '\r\n'
            fi
            echo ""
            echo "=== KEY_END ==="
          fi

          echo "=== MYSQL_CONFIGS_START ==="
          "${compose[@]}" exec -T mysql sh -c '
            pass="${MYSQL_ROOT_PASSWORD:-$MYSQL_PASSWORD}"
            user="root"
            if [ -z "$MYSQL_ROOT_PASSWORD" ]; then user="${MYSQL_USER:-omnistudio}"; fi
            mysql -u"$user" -p"$pass" "${MYSQL_DATABASE:-omnistudio}" -e "SELECT provider_id, enabled, config, secret_ref FROM platform_provider_configs;" 2>/dev/null || \
            mysql -uomnistudio -p"$MYSQL_PASSWORD" omnistudio -e "SELECT provider_id, enabled, config, secret_ref FROM platform_provider_configs;" 2>/dev/null || true
          '
          echo "=== MYSQL_CONFIGS_END ==="

          echo "=== MYSQL_SECRETS_START ==="
          "${compose[@]}" exec -T mysql sh -c '
            pass="${MYSQL_ROOT_PASSWORD:-$MYSQL_PASSWORD}"
            user="root"
            if [ -z "$MYSQL_ROOT_PASSWORD" ]; then user="${MYSQL_USER:-omnistudio}"; fi
            mysql -u"$user" -p"$pass" "${MYSQL_DATABASE:-omnistudio}" -e "SELECT id, ciphertext FROM platform_secrets;" 2>/dev/null || \
            mysql -uomnistudio -p"$MYSQL_PASSWORD" omnistudio -e "SELECT id, ciphertext FROM platform_secrets;" 2>/dev/null || true
          '
          echo "=== MYSQL_SECRETS_END ==="
          EOF

      - name: Process exported data
        run: |
          cat onlineRaw.txt
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("onlineRaw.txt", "utf8");

            function extractSection(name) {
              const startTag = `=== ${name}_START ===`;
              const endTag = `=== ${name}_END ===`;
              const start = raw.indexOf(startTag);
              const end = raw.indexOf(endTag);
              if (start === -1 || end === -1) return "";
              return raw.slice(start + startTag.length, end).trim();
            }

            const envRaw = extractSection("ENV");
            const keyBase64 = extractSection("KEY");
            const configsRaw = extractSection("MYSQL_CONFIGS");
            const secretsRaw = extractSection("MYSQL_SECRETS");

            const env = {};
            for (const line of envRaw.split("\n")) {
              const trimmed = line.trim();
              if (trimmed && !trimmed.startsWith("#") && trimmed.includes("=")) {
                const idx = trimmed.indexOf("=");
                env[trimmed.slice(0, idx).trim()] = trimmed.slice(idx + 1).trim();
              }
            }

            function parseTsv(text) {
              const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
              if (lines.length < 2) return [];
              const headers = lines[0].split("\t");
              return lines.slice(1).map(line => {
                const parts = line.split("\t");
                const obj = {};
                headers.forEach((h, i) => { obj[h] = parts[i] || ""; });
                return obj;
              });
            }

            const configs = parseTsv(configsRaw);
            const secrets = parseTsv(secretsRaw);

            const result = {
              env,
              keyBase64,
              configs,
              secrets
            };

            fs.writeFileSync("onlineExport.json", JSON.stringify(result, null, 2));
            console.log("Successfully generated onlineExport.json! Configs:", configs.length, "Secrets:", secrets.length);
          '

      - uses: actions/upload-artifact@v7
        with:
          name: onlineExport
          path: onlineExport.json
          retention-days: 1

      - name: Clean runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deployKey" "$RUNNER_TEMP/sshKnownHosts"
