name: Export online secrets for local sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          serverHost: ${{ secrets.DEPLOY_HOST }}
          serverUser: ${{ secrets.DEPLOY_USER }}
          serverPath: ${{ secrets.DEPLOY_PATH }}
          deploySshKey: ${{ secrets.DEPLOY_SSH_KEY }}
          deployKnownHosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$deploySshKey" > "$RUNNER_TEMP/deployKey"
          printf '%s\n' "$deployKnownHosts" > "$RUNNER_TEMP/sshKnownHosts"

      - name: Fetch remote secrets
        env:
          serverHost: ${{ secrets.DEPLOY_HOST }}
          serverUser: ${{ secrets.DEPLOY_USER }}
          serverPath: ${{ secrets.DEPLOY_PATH }}
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)

          ssh "${sshOptions[@]}" "$serverUser@$serverHost" bash -s -- "$serverPath" > onlineExport.json << 'EOF'
          set -euo pipefail
          targetPath="$1"
          cd "$targetPath"

          compose=(docker compose -p omnistudio-next --env-file .env -f compose.yaml)
          if [[ -f releaseCompose.yaml ]]; then compose+=(-f releaseCompose.yaml); fi

          appContainer=$("${compose[@]}" ps -q omnistudio-next)
          dataPath=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Source}}{{end}}{{end}}' "$appContainer")

          keyBase64=""
          if [[ -f "$dataPath/platformSecret.key" ]]; then
            keyBase64=$(base64 -w 0 "$dataPath/platformSecret.key" || base64 "$dataPath/platformSecret.key" | tr -d '\r\n')
          fi

          envMatches=$(grep -E '^[A-Z0-9_]*(KEY|URL|SECRET|MODEL)[A-Z0-9_]*=' .env || true)

          configsJson=$("${compose[@]}" exec -T mysql sh -c 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT COALESCE(JSON_ARRAYAGG(JSON_OBJECT(\"providerId\", provider_id, \"enabled\", enabled, \"config\", config, \"secretRef\", secret_ref)), \"[]\") FROM platform_provider_configs;"' | tr -d '\r')
          secretsJson=$("${compose[@]}" exec -T mysql sh -c 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT COALESCE(JSON_ARRAYAGG(JSON_OBJECT(\"id\", id, \"ciphertext\", ciphertext)), \"[]\") FROM platform_secrets;"' | tr -d '\r')

          cat << JSON
          {
            "keyBase64": "$keyBase64",
            "envMatches": $(printf '%s\n' "$envMatches" | sed 's/\\/\\\\/g' | jq -R -s 'split("\n") | map(select(length > 0)) | map(split("=")) | map({(.[0]): (.[1:] | join("="))}) | add // {}'),
            "configs": $configsJson,
            "secrets": $secretsJson
          }
          JSON
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: onlineExport
          path: onlineExport.json
          retention-days: 1

      - name: Clean runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deployKey" "$RUNNER_TEMP/sshKnownHosts"
