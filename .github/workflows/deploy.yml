name: Server pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: 构建成功后部署到服务器
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Linux artifacts
        run: bun run build:server
      - name: Check server and web types
        run: |
          bun run --cwd apps/server typecheck
          bun run --cwd apps/web typecheck
      - name: Build application image
        run: |
          deployContext="$RUNNER_TEMP/deployContext"
          mkdir -p "$deployContext"
          cp deployDockerfile "$deployContext/deployDockerfile"
          cp "$(command -v bun)" "$deployContext/bun"
          cp -R build "$deployContext/build"
          docker build --platform linux/amd64 --build-arg "buildCommit=$GITHUB_SHA" \
            -f "$deployContext/deployDockerfile" -t "omnistudio-next-app:$GITHUB_SHA" "$deployContext"
          docker save "omnistudio-next-app:$GITHUB_SHA" | gzip -1 > appImage.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: serverImage
          path: appImage.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: serverProduction
      cancel-in-progress: false
    env:
      serverHost: ${{ secrets.DEPLOY_HOST }}
      serverUser: ${{ secrets.DEPLOY_USER }}
      serverPath: ${{ secrets.DEPLOY_PATH }}
      deploySshKey: ${{ secrets.DEPLOY_SSH_KEY }}
      deployKnownHosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      seedanceApiKey: ${{ secrets.UTOOO_SEEDANCE_API_KEY }}
    steps:
      - name: Configure SSH
        run: |
          : "${serverHost:?Configure DEPLOY_HOST}"
          : "${serverUser:?Configure DEPLOY_USER}"
          : "${serverPath:?Configure DEPLOY_PATH}"
          : "${deploySshKey:?Configure DEPLOY_SSH_KEY}"
          : "${deployKnownHosts:?Configure DEPLOY_KNOWN_HOSTS}"
          : "${seedanceApiKey:?Configure UTOOO_SEEDANCE_API_KEY}"
          [[ "$serverHost" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$serverUser" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$serverPath" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          umask 077
          printf '%s\n' "$deploySshKey" > "$RUNNER_TEMP/deployKey"
          printf '%s\n' "$deployKnownHosts" > "$RUNNER_TEMP/sshKnownHosts"
      - uses: actions/download-artifact@v8
        with:
          name: serverImage
      - name: Upload image
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" -o ConnectTimeout=10)
          ssh "${sshOptions[@]}" "$serverUser@$serverHost" \
            "test -f '$serverPath/compose.yaml' && test -f '$serverPath/.env' && mkdir -p '$serverPath/releases/$GITHUB_SHA'"
          scp "${sshOptions[@]}" appImage.tar.gz "$serverUser@$serverHost:$serverPath/releases/$GITHUB_SHA/"
          printf '%s' "$seedanceApiKey" | ssh "${sshOptions[@]}" "$serverUser@$serverHost" \
            "umask 077; cat > '$serverPath/releases/$GITHUB_SHA/utoooSeedanceApiKey'"
      - name: Back up and deploy application
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" -o ConnectTimeout=10)
          ssh "${sshOptions[@]}" "$serverUser@$serverHost" bash -s -- "$serverPath" "$GITHUB_SHA" <<'SH'
          set -euo pipefail
          umask 077
          serverPath=$1
          releaseCommit=$2
          [[ "$releaseCommit" =~ ^[a-f0-9]{40}$ ]]
          cd "$serverPath"
          exec 9>deployLock
          flock -n 9
          releaseDirectory="$serverPath/releases/$releaseCommit"
          image="omnistudio-next-app:$releaseCommit"
          compose=(docker compose -p omnistudio-next --env-file .env -f compose.yaml)
          appContainer=$("${compose[@]}" ps -q omnistudio-next)
          mysqlContainer=$("${compose[@]}" ps -q mysql)
          test -n "$appContainer"
          test -n "$mysqlContainer"
          keyFile="$releaseDirectory/utoooSeedanceApiKey"
          test -s "$keyFile"
          {
            found=0
            while IFS= read -r line; do
              case "$line" in
                UTOOO_SEEDANCE_API_KEY=*) printf 'UTOOO_SEEDANCE_API_KEY='; cat "$keyFile"; printf '\n'; found=1 ;;
                *) printf '%s\n' "$line" ;;
              esac
            done < .env
            if [ "$found" -eq 0 ]; then printf 'UTOOO_SEEDANCE_API_KEY='; cat "$keyFile"; printf '\n'; fi
          } > .env.pending
          chmod 600 .env.pending
          mv .env.pending .env
          rm -f "$keyFile"
          previousImage=$(docker inspect --format '{{.Image}}' "$appContainer")
          printf '%s\n' "$previousImage" > "$releaseDirectory/previousImage"
          if [ ! -f "$releaseDirectory/database.sql.gz" ]; then
            docker exec "$mysqlContainer" sh -c \
              'MYSQL_PWD="$MYSQL_PASSWORD" exec mysqldump --user="$MYSQL_USER" --single-transaction --quick --routines --triggers --no-tablespaces "$MYSQL_DATABASE"' \
              | gzip > "$releaseDirectory/databasePending.sql.gz"
            gzip -t "$releaseDirectory/databasePending.sql.gz"
            mv "$releaseDirectory/databasePending.sql.gz" "$releaseDirectory/database.sql.gz"
          fi
          gzip -t "$releaseDirectory/database.sql.gz"
          docker load < "$releaseDirectory/appImage.tar.gz"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$releaseCommit"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64

          writeImage() {
            printf 'services:\n  omnistudio-next:\n    image: "%s"\n    environment:\n      UTOOO_SEEDANCE_API_KEY: ${UTOOO_SEEDANCE_API_KEY:-}\n' "$1" > releaseCompose.yaml
          }
          waitHealthy() {
            for attempt in {1..60}; do
              if curl -fsS --max-time 5 http://127.0.0.1:3000/api/auth/setupStatus >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            return 1
          }
          rollback() {
            exitCode=${1:-$?}
            trap - ERR
            trap '' HUP INT TERM
            set +e
            writeImage "$previousImage"
            "${compose[@]}" -f releaseCompose.yaml up -d --no-build --no-deps omnistudio-next
            if waitHealthy; then echo 'Deployment failed; previous image restored.'; else echo 'Rollback failed; inspect the application on the server.'; fi
            exit "$exitCode"
          }
          # ACT: Image rollback leaves SQL migrations in place; retain the SQL backup for manual database recovery.
          trap rollback ERR
          trap 'rollback 130' HUP INT TERM
          writeImage "$image"
          "${compose[@]}" -f releaseCompose.yaml up -d --no-build --no-deps omnistudio-next
          waitHealthy
          appContainer=$("${compose[@]}" -f releaseCompose.yaml ps -q omnistudio-next)
          test "$(docker inspect --format '{{.Image}}' "$appContainer")" = "$(docker image inspect --format '{{.Id}}' "$image")"
          docker exec "$mysqlContainer" sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --batch --skip-column-names' <<'SQL'
          INSERT INTO platform_provider_configs (id, provider_id, enabled, config, secret_ref, created_at, updated_at)
          VALUES (UUID(), 'utoooSeedance', 1, JSON_OBJECT('apiUrl', 'https://ai-gateway.utooo.com', 'baseUrl', 'https://ai-gateway.utooo.com', 'protocol', 'openai-completions'), 'UTOOO_SEEDANCE_API_KEY', UTC_TIMESTAMP(), UTC_TIMESTAMP())
          ON DUPLICATE KEY UPDATE enabled = 1, config = VALUES(config), secret_ref = VALUES(secret_ref), updated_at = UTC_TIMESTAMP();
          UPDATE platform_provider_configs SET enabled = 0, updated_at = UTC_TIMESTAMP() WHERE provider_id = 'jojokey';
          UPDATE platform_models SET enabled = 0, updated_at = UTC_TIMESTAMP() WHERE provider_id = 'jojokey' OR (provider_id = 'utoooSeedance' AND model_id IN ('doubao-seedance-2-0-fast-260128', 'doubao-seedance-2-0-mini-260615'));
          INSERT INTO platform_models (id, provider_id, model_id, label, media_type, api_model_id, enabled, capabilities, sort_order, created_at, updated_at)
          VALUES
            (UUID(), 'utoooSeedance', 'doubao-seedance-2-5-260628', 'Seedance 2.5', 'video', NULL, 1, NULL, 180, UTC_TIMESTAMP(), UTC_TIMESTAMP()),
            (UUID(), 'utoooSeedance', 'doubao-seedance-2-0-260128', 'Seedance 2.0', 'video', NULL, 1, NULL, 190, UTC_TIMESTAMP(), UTC_TIMESTAMP())
          ON DUPLICATE KEY UPDATE enabled = 1, label = VALUES(label), sort_order = VALUES(sort_order), updated_at = UTC_TIMESTAMP();
          SET @priceBookId = (SELECT active_price_book_version_id FROM platform_pricing_settings WHERE id = 'platform' LIMIT 1);
          INSERT INTO platform_pricing_items (id, price_book_version_id, provider_id, model_id, media_type, unit, credits_per_unit, constraints, created_at, updated_at)
          VALUES
            (UUID(), @priceBookId, 'utoooSeedance', 'doubao-seedance-2-5-260628', 'video', 'second', 153.0, JSON_OBJECT('resolutionTiers', JSON_OBJECT('480p', 32, '720p', 68, '1080p', 153)), UTC_TIMESTAMP(), UTC_TIMESTAMP()),
            (UUID(), @priceBookId, 'utoooSeedance', 'doubao-seedance-2-0-260128', 'video', 'second', 86.0, JSON_OBJECT('resolutionTiers', JSON_OBJECT('480p', 18, '720p', 38, '1080p', 86)), UTC_TIMESTAMP(), UTC_TIMESTAMP())
          ON DUPLICATE KEY UPDATE unit = VALUES(unit), credits_per_unit = VALUES(credits_per_unit), constraints = VALUES(constraints), updated_at = UTC_TIMESTAMP();
          SQL
          test "$(docker exec "$mysqlContainer" sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --user="$MYSQL_USER" --database="$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT COUNT(*) FROM platform_models m JOIN platform_provider_configs p ON p.provider_id=m.provider_id WHERE m.provider_id=\"utoooSeedance\" AND m.enabled=1 AND p.enabled=1 AND m.model_id IN (\"doubao-seedance-2-5-260628\",\"doubao-seedance-2-0-260128\")"')" = 2
          printf '%s\n' "$releaseCommit" > deployedCommit
          trap - ERR HUP INT TERM
          echo "Deployed $releaseCommit"
          SH
      - name: Remove runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deployKey" "$RUNNER_TEMP/sshKnownHosts"
