name: Server pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: 构建成功后部署到服务器
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Linux artifacts
        run: bun run build:server
      - name: Check server and web types
        run: |
          bun run --cwd apps/server typecheck
          bun run --cwd apps/web typecheck
      - name: Validate deployment configuration
        run: |
          bash -n scripts/deployServer.sh scripts/deploymentRetention.sh
          MYSQL_PASSWORD=ci MYSQL_ROOT_PASSWORD=ci docker compose -f compose.yaml config --quiet
          MYSQL_PASSWORD=ci MYSQL_ROOT_PASSWORD=ci docker compose -f deployCompose.yaml config --quiet
      - name: Build application image
        run: |
          deployContext="$RUNNER_TEMP/deployContext"
          mkdir -p "$deployContext"
          cp deployDockerfile "$deployContext/deployDockerfile"
          cp "$(command -v bun)" "$deployContext/bun"
          cp -R build "$deployContext/build"
          docker build --platform linux/amd64 --build-arg "buildCommit=$GITHUB_SHA" \
            -f "$deployContext/deployDockerfile" -t "omnistudio-next-app:$GITHUB_SHA" "$deployContext"
          docker save "omnistudio-next-app:$GITHUB_SHA" | gzip -1 > appImage.tar.gz
          docker image inspect --format '{{.Size}}' "omnistudio-next-app:$GITHUB_SHA" > imageSize
          sha256sum appImage.tar.gz | sed 's/appImage.tar.gz/appImagePending.tar.gz/' > imageChecksum
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: serverImage
          path: |
            appImage.tar.gz
            imageSize
            imageChecksum
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: serverProduction
      cancel-in-progress: false
    env:
      serverHost: ${{ secrets.DEPLOY_HOST }}
      serverUser: ${{ secrets.DEPLOY_USER }}
      serverPath: ${{ secrets.DEPLOY_PATH }}
      deploySshKey: ${{ secrets.DEPLOY_SSH_KEY }}
      deployKnownHosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      keepReleases: ${{ vars.DEPLOY_KEEP_RELEASES || '3' }}
      keepBackups: ${{ vars.DEPLOY_BACKUP_KEEP_COUNT || '7' }}
      backupDays: ${{ vars.DEPLOY_BACKUP_KEEP_DAYS || '30' }}
      minFreeGiB: ${{ vars.DEPLOY_MIN_FREE_GIB || '5' }}
      logSizeMb: ${{ vars.DEPLOY_LOG_SIZE_MB || '20' }}
      logFiles: ${{ vars.DEPLOY_LOG_FILES || '5' }}
      drainSeconds: ${{ vars.DEPLOY_DRAIN_SECONDS || '300' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure SSH
        run: |
          : "${serverHost:?Configure DEPLOY_HOST}"
          : "${serverUser:?Configure DEPLOY_USER}"
          : "${serverPath:?Configure DEPLOY_PATH}"
          : "${deploySshKey:?Configure DEPLOY_SSH_KEY}"
          : "${deployKnownHosts:?Configure DEPLOY_KNOWN_HOSTS}"
          [[ "$serverHost" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$serverUser" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$serverPath" =~ ^/[a-zA-Z0-9/_-]+$ && "$serverPath" != / ]]
          for value in "$keepReleases" "$keepBackups" "$backupDays" "$minFreeGiB" "$logSizeMb" "$logFiles" "$drainSeconds"; do
            [[ "$value" =~ ^[1-9][0-9]{0,11}$ ]]
          done
          umask 077
          printf '%s\n' "$deploySshKey" > "$RUNNER_TEMP/deployKey"
          printf '%s\n' "$deployKnownHosts" > "$RUNNER_TEMP/sshKnownHosts"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef833 # v8
        with:
          name: serverImage
          path: serverImage
      - name: Check disk before upload
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          archiveBytes=$(stat -c %s serverImage/appImage.tar.gz)
          imageBytes=$(cat serverImage/imageSize)
          [[ "$imageBytes" =~ ^[1-9][0-9]{0,11}$ ]]
          attempt="attempt${GITHUB_RUN_ID}x${GITHUB_RUN_ATTEMPT}"
          ssh "${sshOptions[@]}" "$serverUser@$serverHost" bash -s -- check "$serverPath" "$GITHUB_SHA" "$attempt" \
            "$archiveBytes" "$imageBytes" "$keepReleases" "$keepBackups" "$backupDays" "$minFreeGiB" "$logSizeMb" "$logFiles" "$drainSeconds" \
            < scripts/deployServer.sh
      - name: Upload image and deployment scripts
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          scp "${sshOptions[@]}" serverImage/appImage.tar.gz "$serverUser@$serverHost:$serverPath/releases/$GITHUB_SHA/appImagePending.tar.gz"
          scp "${sshOptions[@]}" serverImage/imageChecksum scripts/deployServer.sh scripts/deploymentRetention.sh \
            "$serverUser@$serverHost:$serverPath/releases/$GITHUB_SHA/"
      - name: Drain, back up and deploy
        run: |
          sshOptions=(-i "$RUNNER_TEMP/deployKey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/sshKnownHosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          archiveBytes=$(stat -c %s serverImage/appImage.tar.gz)
          imageBytes=$(cat serverImage/imageSize)
          [[ "$imageBytes" =~ ^[1-9][0-9]{0,11}$ ]]
          attempt="attempt${GITHUB_RUN_ID}x${GITHUB_RUN_ATTEMPT}"
          ssh "${sshOptions[@]}" "$serverUser@$serverHost" bash "$serverPath/releases/$GITHUB_SHA/deployServer.sh" \
            deploy "$serverPath" "$GITHUB_SHA" "$attempt" "$archiveBytes" "$imageBytes" \
            "$keepReleases" "$keepBackups" "$backupDays" "$minFreeGiB" "$logSizeMb" "$logFiles" "$drainSeconds"
      - name: Remove runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deployKey" "$RUNNER_TEMP/sshKnownHosts"
