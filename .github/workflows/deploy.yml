name: Deploy server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      serverHost: ${{ secrets.DEPLOY_HOST }}
      serverUser: ${{ secrets.DEPLOY_USER }}
      serverPath: ${{ secrets.DEPLOY_PATH }}
      deploySshKey: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux artifacts
        run: |
          bun run dev:plugins
          bun run build

      - name: Build application image
        run: |
          rm -rf .deploy-context
          mkdir .deploy-context
          cp deployDockerfile .deploy-context/deployDockerfile
          cp "$(command -v bun)" .deploy-context/bun
          cp -R build .deploy-context/build
          docker build -f .deploy-context/deployDockerfile -t omnistudio-next-app:latest .deploy-context
          docker save omnistudio-next-app:latest | gzip -1 > app-image.tar.gz
          rm -rf .deploy-context

      - name: Configure SSH
        run: |
          test -n "$serverHost"
          test -n "$serverUser"
          test -n "$serverPath"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$serverHost" >> "$HOME/.ssh/known_hosts"
          test -n "$deploySshKey"
          printf '%s\n' "$deploySshKey" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      - name: Upload image and Compose file
        run: |
          scp -i "$HOME/.ssh/deploy_key" app-image.tar.gz deployCompose.yaml "$serverUser@$serverHost:$serverPath/"

      - name: Restart production services
        run: |
          ssh -i "$HOME/.ssh/deploy_key" "$serverUser@$serverHost" \
            "set -eu; cd '$serverPath'; docker load < app-image.tar.gz; cp deployCompose.yaml compose.yaml; docker compose up -d --no-build; rm -f app-image.tar.gz; docker image prune -f; curl -fsS http://127.0.0.1:3000/ >/dev/null"
